name: Release Desktop (Aside / Bilin)

# Builds installers for every distribution by checking out the PRIVATE source
# repo (forrany/Aider) at a given tag, then publishes a DRAFT release here.
#
# Triggers:
#   - repository_dispatch type "release" (sent by forrany/Aider on tag push)
#   - manual workflow_dispatch with an explicit tag
#
# Required secrets:
#   SOURCE_REPO_PAT                    fine-grained PAT, Contents:Read on forrany/Aider
#   TAURI_SIGNING_PRIVATE_KEY          Tauri updater minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# UNSIGNED builds otherwise: ad-hoc macOS signing ("-"), no notarization /
# Windows codesign yet (same as source repo policy).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag in forrany/Aider (e.g. v1.4.2)"
        required: true
        type: string
      distributions:
        description: "Which distributions to build"
        type: choice
        default: "bilin"
        options: ["bilin", "base,bilin", "base"]
  repository_dispatch:
    types: [release]

permissions:
  contents: write

env:
  DESKTOP_BUILD: "true"
  NEXT_PUBLIC_DESKTOP_BUILD: "true"

jobs:
  # ── Resolve tag + distribution list ──────────────────────────────
  matrix:
    runs-on: ubuntu-latest
    outputs:
      distributions: ${{ steps.set.outputs.distributions }}
      distributions_raw: ${{ steps.set.outputs.distributions_raw }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          RAW_DISTS: ${{ github.event.inputs.distributions }}
          DISPATCH_DISTS: ${{ github.event.client_payload.distributions }}
        run: |
          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          if [ -z "$tag" ]; then echo "::error::no tag provided"; exit 1; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag format: $tag"; exit 1
          fi
          raw="${RAW_DISTS:-${DISPATCH_DISTS:-bilin}}"
          json=$(printf '%s' "$raw" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | paste -sd, -)
          echo "distributions=[$json]" >> "$GITHUB_OUTPUT"
          echo "distributions_raw=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Will build [$raw] from $tag"

  # ───────────────────────────── macOS ─────────────────────────────
  build-macos:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.matrix.outputs.distributions) }}
        arch: [aarch64, x64]
        include:
          - arch: aarch64
            os: macos-14
            target: aarch64-apple-darwin
            node_platform: Darwin-arm64
          - arch: x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            node_platform: Darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: forrany/Aider
          ref: refs/tags/${{ needs.matrix.outputs.tag }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/desktop/src-tauri }

      - name: Patch version from tag
        shell: bash
        run: bash .github/scripts/patch-version.sh "refs/tags/${{ needs.matrix.outputs.tag }}"

      - name: Wire distribution (inject preset plugins + tauri overlay + icons)
        shell: bash
        run: |
          node app/scripts/build-dist.mjs "${{ matrix.distribution }}"
          bash .github/scripts/apply-icons.sh "${{ matrix.distribution }}"

      - name: Install frontend deps
        run: cd app/frontend && npm ci --legacy-peer-deps
      - name: Build frontend
        run: cd app/frontend && npx next build
        env:
          NEXT_PUBLIC_ASIDE_DISTRIBUTION: ${{ matrix.distribution }}

      - name: Build backend (PyInstaller)
        run: |
          cd app/backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller
          pyinstaller openyak.spec --noconfirm

      # Hard gate: never ship an arm64 backend in an x64 bundle (or vice versa).
      - name: Verify backend binary architecture
        shell: bash
        run: |
          set -euo pipefail
          BIN="app/backend/dist/openyak-backend/openyak-backend"
          if [ ! -f "$BIN" ]; then BIN="app/backend/dist/openyak-backend"; fi
          if [ ! -f "$BIN" ]; then
            echo "::error::backend binary not found under app/backend/dist/openyak-backend"
            find app/backend/dist -maxdepth 3 -type f | head -50
            exit 1
          fi
          info="$(file "$BIN")"
          echo "backend binary: $info"
          case "${{ matrix.arch }}" in
            aarch64) echo "$info" | grep -Eq 'arm64|aarch64' \
              || { echo "::error::expected arm64/aarch64 backend, got: $info"; exit 1; } ;;
            x64) echo "$info" | grep -Eq 'x86_64' \
              || { echo "::error::expected x86_64 backend, got: $info"; exit 1; } ;;
            *) echo "::error::unknown matrix.arch=${{ matrix.arch }}"; exit 1 ;;
          esac

      - name: Download Node.js runtime
        run: cd app/backend && python3 scripts/download_node.py --platform ${{ matrix.node_platform }}

      - name: Build Tauri (dmg + signed updater bundle)
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/desktop
          npx @tauri-apps/cli build \
            --target ${{ matrix.target }} \
            --config src-tauri/tauri.dist.json \
            --config src-tauri/build.macos-${{ matrix.arch }}.json

      - name: Verify bundled backend architecture
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "app/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" \
            -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle found after tauri build"; exit 1
          fi
          BIN="$APP/Contents/Resources/backend/openyak-backend"
          if [ ! -f "$BIN" ]; then
            echo "::error::bundled backend missing at $BIN"; exit 1
          fi
          info="$(file "$BIN")"
          case "${{ matrix.arch }}" in
            aarch64) echo "$info" | grep -Eq 'arm64|aarch64' || exit 1 ;;
            x64)     echo "$info" | grep -Eq 'x86_64' || exit 1 ;;
          esac

      - name: Rename updater artifacts with version and arch
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_MACOS="app/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          TAR="$(find "$BUNDLE_MACOS" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          if [ -z "$TAR" ]; then
            echo "::error::no .app.tar.gz found in $BUNDLE_MACOS"
            exit 1
          fi
          DIR="$(dirname "$TAR")"
          BASE="$(basename "$TAR" .app.tar.gz)"
          VER="${{ needs.matrix.outputs.tag }}"
          VER="${VER#v}"
          TARGET_NAME="${BASE}_${VER}_${{ matrix.arch }}.app.tar.gz"
          mv "$TAR" "$DIR/$TARGET_NAME"
          if [ -f "$TAR.sig" ]; then
            mv "$TAR.sig" "$DIR/$TARGET_NAME.sig"
          else
            echo "::error::missing signature file: $TAR.sig"
            exit 1
          fi
          echo "Renamed updater artifact to $TARGET_NAME and $TARGET_NAME.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            app/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────── Windows ─────────────────────────────
  build-windows:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.matrix.outputs.distributions) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: forrany/Aider
          ref: refs/tags/${{ needs.matrix.outputs.tag }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/desktop/src-tauri }

      - name: Patch version from tag
        shell: bash
        run: bash .github/scripts/patch-version.sh "refs/tags/${{ needs.matrix.outputs.tag }}"

      - name: Wire distribution
        shell: bash
        run: |
          node app/scripts/build-dist.mjs "${{ matrix.distribution }}"
          bash .github/scripts/apply-icons.sh "${{ matrix.distribution }}"

      - name: Install frontend deps
        run: cd app/frontend && npm ci --legacy-peer-deps
      - name: Build frontend
        run: cd app/frontend && npx next build
        env:
          NEXT_PUBLIC_ASIDE_DISTRIBUTION: ${{ matrix.distribution }}

      - name: Build backend (PyInstaller)
        shell: bash
        run: |
          cd app/backend
          pip install -r requirements.txt pyinstaller
          pyinstaller openyak.spec --noconfirm
      - name: Download Node.js runtime
        run: cd app/backend && python scripts/download_node.py

      - name: Build Tauri (NSIS + signed updater artifact)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/desktop
          npx @tauri-apps/cli build \
            --config src-tauri/tauri.dist.json \
            --config src-tauri/build.windows.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.distribution }}
          path: |
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────── Linux ─────────────────────────────
  build-linux:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.matrix.outputs.distributions) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: forrany/Aider
          ref: refs/tags/${{ needs.matrix.outputs.tag }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm file patchelf build-essential curl wget libssl-dev \
            libgtk-3-dev libsoup-3.0-dev libxdo-dev
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/desktop/src-tauri }

      - name: Patch version from tag
        run: bash .github/scripts/patch-version.sh "refs/tags/${{ needs.matrix.outputs.tag }}"

      - name: Wire distribution
        run: |
          node app/scripts/build-dist.mjs "${{ matrix.distribution }}"
          bash .github/scripts/apply-icons.sh "${{ matrix.distribution }}"

      - name: Install frontend deps
        run: cd app/frontend && npm ci --legacy-peer-deps
      - name: Build frontend
        run: cd app/frontend && npx next build
        env:
          NEXT_PUBLIC_ASIDE_DISTRIBUTION: ${{ matrix.distribution }}

      - name: Build backend (PyInstaller)
        run: |
          cd app/backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller
          pyinstaller openyak.spec --noconfirm
      - name: Download Node.js runtime
        run: |
          cd app/backend
          source venv/bin/activate
          python scripts/download_node.py

      - name: Build Tauri (deb + rpm, unsigned)
        run: |
          cd app/desktop
          npx @tauri-apps/cli build \
            --config src-tauri/tauri.dist.json \
            --config src-tauri/build.linux-x64.json \
            --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.distribution }}
          path: |
            app/desktop/src-tauri/target/release/bundle/deb/*.deb
            app/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────── Publish ─────────────────────────────
  publish:
    needs: [matrix, build-macos, build-windows, build-linux]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # self — provides gen-update-manifests.mjs
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: List + checksum
        run: |
          find artifacts -type f | sort
          ( cd artifacts && find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.app.tar.gz' \) -exec sha256sum {} \; ) | sort > CHECKSUMS.txt
          { echo '## SHA-256 Checksums'; echo '```'; cat CHECKSUMS.txt; echo '```'; } > RELEASE_BODY.md
      - name: Generate updater manifests
        run: |
          node .github/scripts/gen-update-manifests.mjs \
            --artifacts artifacts \
            --out update-manifests \
            --tag "${{ needs.matrix.outputs.tag }}" \
            --dist "${{ needs.matrix.outputs.distributions_raw }}" \
            --repo "${GITHUB_REPOSITORY}"
          cat update-manifests/*.json
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.matrix.outputs.tag }}
          draft: true
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          append_body: true
          files: |
            artifacts/**/*
            update-manifests/*.json